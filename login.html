<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>BIENVENIDA NAYELIS </title>
		<style>
			:root{
				--bg-start:#fff0f6;
				--bg-end:#fff5f8;
				--card:#ffffff;
				--accent:#ec4899;
				--accent-dark:#be185d;
				--muted:#7a4b5f;
				--input-border:#f3d6e6;
				--error:#9b1c31;
				font-family: Poppins, Inter, system-ui, Arial, sans-serif;
				color: #2b1223;
			}

			html,body{height:100%;margin:0}
			.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--bg-start),var(--bg-end))}
			.card{max-width:760px;width:100%;background:var(--card);border-radius:12px;box-shadow:0 12px 30px rgba(236,72,153,0.12);padding:20px}
			.split{display:flex;gap:20px;align-items:stretch}
			.image-panel{flex:1;min-width:300px;display:flex;align-items:center;justify-content:center;padding:6px}
			.image-panel img{width:100%;height:100%;max-height:420px;object-fit:cover;border-radius:10px}
			.form-panel{flex:1;min-width:300px;display:flex;flex-direction:column;justify-content:center;padding:8px}
			h1{font-size:20px;margin:0 0 14px;color:var(--accent-dark)}
			label{display:block;font-size:13px;margin:0 0 6px;color:var(--muted)}
			.form-group{margin-bottom:14px}
			input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--input-border);border-radius:10px;font-size:14px;background:#fff;box-sizing:border-box}
			.password-row{display:flex;gap:8px;align-items:center}
			.toggle-btn{padding:8px 10px;border-radius:8px;border:1px solid rgba(230,200,220,0.8);background:#fff;color:var(--accent-dark);white-space:nowrap}
			.actions{display:flex;align-items:center;justify-content:center;margin-top:18px;gap:12px}
			button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(236,72,153,0.12)}
			button:hover{background:var(--accent-dark)}
			button[disabled]{opacity:.6;cursor:not-allowed}
			.small{font-size:13px;color:var(--muted)}
			a{color:var(--accent-dark);text-decoration:none;font-weight:600}
			.toggle-btn{padding:8px;border-radius:8px;border:1px solid rgba(230,200,220,0.8);background:#fff;color:var(--accent-dark)}
			.error{color:var(--error);font-size:13px;margin-top:8px}
			.footer{margin-top:18px;font-size:13px;color:#7a5b6b;text-align:center}
			@media (max-width:700px){
				.split{flex-direction:column}
				.image-panel img{max-height:240px}
				.card{padding:16px}
			}
		</style>
	</head>
	<body>
		<main class="center">
			<section class="card" aria-labelledby="login-title">
				<div class="split">
					<div class="image-panel">
						<div class="image-panel">
							<!-- Coloca aquí la ruta de acceso a tu imagen JPEG -->
							<img src="C:\Users\jvinas\Desktop\PLANEADOR NAYELIS\img\imagen login.jpg" alt="Imagen decorativa" />
						</div>
					</div>
					<div class="form-panel">
						<h1 id="login-title">Inicia sesión</h1>
						<form id="loginForm" novalidate>
							<div class="form-group">
								<label for="user">Usuario</label>
								<input id="user" name="user" type="text" inputmode="text" autocomplete="username" required />
							</div>

							<div class="form-group">
								<label for="pass">Contraseña</label>
								<div class="password-row">
									<input id="pass" name="pass" type="password" autocomplete="current-password" required />
									
								</div>
							</div>

							

							<div class="error" id="error" role="alert" aria-live="polite" style="display:none"></div>

							
							<div class="actions">
								<button id="submitBtn" type="submit">Entrar</button>
                                
							</div>
							</div>
						</form>
						
					</div>
				</div>
			</section>
		</main>

		<script>
			const form = document.getElementById('loginForm');
			const userInput = document.getElementById('user');
			const passInput = document.getElementById('pass');
			const errorEl = document.getElementById('error');
			const toggle = document.getElementById('toggle');

			// Restore remembered username
			try{
				const saved = localStorage.getItem('pn_username');
				if(saved) userInput.value = saved;
			}catch(e){}

			toggle.addEventListener('click', ()=>{
				const shown = passInput.type === 'text';
				passInput.type = shown ? 'password' : 'text';
				toggle.textContent = shown ? 'Mostrar' : 'Ocultar';
			});

			form.addEventListener('submit', (e)=>{
				e.preventDefault();
				errorEl.style.display = 'none';
				const user = userInput.value.trim();
				const pass = passInput.value;

				if(!user){ showError('Introduce tu usuario o correo'); return }
				if(!pass){ showError('Introduce tu contraseña'); return }

				// basic example validation (replace with server auth in production)
				// Accept any non-empty credentials and redirect to frontend.html
				try{
					if(document.getElementById('remember').checked) localStorage.setItem('pn_username', user);
					else localStorage.removeItem('pn_username');
				}catch(e){}

				window.location.href = 'frontend.html';
			});

			function showError(msg){ errorEl.textContent = msg; errorEl.style.display = 'block' }
		</script>
	</body>
</html>
