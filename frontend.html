<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Formulario - Frontend</title>
    <style>
      body{font-family:Inter, Arial, sans-serif;background:#fff7fb;color:#2b1223;margin:0;padding:28px}
      .container{max-width:760px;margin:32px auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,0.06)}
      h1{color:#be185d;margin-top:0}
      label{display:block;margin:12px 0 6px}
      input,textarea,select{width:100%;padding:10px;border:1px solid #f3d6e6;border-radius:8px}
      .actions{margin-top:14px}
      a{color:#ec4899;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Formulario principal</h1>
      <p>Este es el formulario al que debe redirigir el login.</p>
      <form id="mainForm">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" />

        <label for="email">Correo</label>
        <input id="email" name="email" type="email" />

        <label for="nota">Nota</label>
        <textarea id="nota" name="nota" rows="4"></textarea>

        <div class="actions">
          <button type="submit" style="background:#ec4899;color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer">Enviar</button>
          <a href="login.html" style="margin-left:12px">Volver al login</a>
        </div>
      </form>
    </main>
  </body>
</html>
